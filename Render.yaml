services:
  - type: web
    name: ask-your-data
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Long timeout: a question can wait through several retries when Google is busy.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you enter this in the Render dashboard, never in the code
      - key: SIGNUP_CODE
        sync: false          # the invite code you share with people
      - key: FLASK_SECRET_KEY
        generateValue: true  # random key, created by Render
      - key: DATA_DIR
        value: /var/data     # the persistent disk below
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: ask-your-data-data
      mountPath: /var/data
      sizeGB: 1